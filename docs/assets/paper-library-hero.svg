<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Paper Library interface preview</title>
  <desc id="desc">A stylized paper library, research canvas and AI composer interface in blue and ivory.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="30" x2="1340" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F7F2"/>
      <stop offset=".52" stop-color="#EEF3FA"/>
      <stop offset="1" stop-color="#E3ECFA"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#477BEA"/>
      <stop offset="1" stop-color="#1757CB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#233B68" flood-opacity=".14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1440" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1230" cy="105" r="170" fill="#BFD5FF" opacity=".34" filter="url(#soft)"/>
  <circle cx="240" cy="680" r="190" fill="#D8E9DE" opacity=".46" filter="url(#soft)"/>

  <g opacity=".78">
    <path d="M70 96H1370" stroke="#B5C4D8" stroke-dasharray="4 12"/>
    <path d="M70 664H1370" stroke="#B5C4D8" stroke-dasharray="4 12"/>
    <text x="74" y="76" fill="#54647A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">PAPER LIBRARY / RESEARCH WORKSPACE</text>
    <text x="1198" y="688" fill="#54647A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">LOCAL-FIRST</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="82" y="124" width="1276" height="510" rx="26" fill="#FCFCFA" stroke="#D7DFEA"/>
    <rect x="82" y="124" width="246" height="510" rx="26" fill="#F3F5F7"/>
    <path d="M328 124V634" stroke="#D9E0E8"/>
    <rect x="110" y="156" width="44" height="44" rx="13" fill="url(#blue)"/>
    <path d="M123 169H141V186H123V169ZM127 165H137" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="168" y="185" fill="#17243A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750">Library</text>

    <rect x="104" y="224" width="202" height="48" rx="14" fill="#2563D8"/>
    <path d="M124 239V257M130 237V257M136 242V257" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <text x="151" y="255" fill="white" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">My Papers</text>
    <rect x="267" y="236" width="27" height="24" rx="12" fill="#4D7DE0"/>
    <text x="275" y="253" fill="white" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">39</text>

    <g fill="#536176" font-family="Inter, Arial, sans-serif" font-size="14">
      <text x="122" y="312">☆</text><text x="151" y="312">Starred</text>
      <text x="122" y="355">◷</text><text x="151" y="355">Daily Board</text>
      <text x="122" y="398">⚑</text><text x="151" y="398">Flagged</text>
    </g>
    <text x="106" y="454" fill="#8490A1" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">COLLECTIONS</text>
    <g fill="#3F4C60" font-family="Inter, Arial, sans-serif" font-size="13">
      <text x="121" y="493">▱</text><text x="151" y="493">LLM Systems</text>
      <text x="121" y="531">▱</text><text x="151" y="531">Optics</text>
      <text x="121" y="569">▱</text><text x="151" y="569">Computer Vision</text>
    </g>

    <text x="366" y="172" fill="#17243A" font-family="Georgia, serif" font-size="29" font-weight="700">Your research, in one place.</text>
    <text x="366" y="199" fill="#748195" font-family="Inter, Arial, sans-serif" font-size="13">Library · Reading · Connections · AI</text>
    <rect x="366" y="226" width="552" height="44" rx="14" fill="#F5F7FA" stroke="#DDE3EB"/>
    <circle cx="391" cy="248" r="7" stroke="#8090A5" stroke-width="2"/>
    <path d="M396 253L402 259" stroke="#8090A5" stroke-width="2" stroke-linecap="round"/>
    <text x="418" y="253" fill="#9AA4B2" font-family="Inter, Arial, sans-serif" font-size="13">Search papers, authors, venues…</text>

    <g font-family="Inter, Arial, sans-serif">
      <rect x="366" y="294" width="552" height="78" rx="16" fill="#EEF4FF" stroke="#8DB2F5"/>
      <rect x="382" y="310" width="38" height="46" rx="10" fill="#D8E7FF"/>
      <path d="M393 320H409V347H393V320ZM397 326H405M397 332H405M397 338H403" stroke="#2563D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="435" y="323" fill="#718099" font-size="11" font-weight="700">OSDI 2026 · NPU</text>
      <text x="435" y="347" fill="#17243A" font-size="15" font-weight="700">Inference in the Shadows</text>
      <rect x="810" y="315" width="86" height="24" rx="12" fill="#DCE9FF"/>
      <text x="828" y="332" fill="#245BBE" font-size="11" font-weight="700">CCF · A</text>

      <rect x="366" y="384" width="552" height="68" rx="16" fill="#FFFFFF" stroke="#E1E5EB"/>
      <rect x="382" y="399" width="38" height="38" rx="10" fill="#E9F2ED"/>
      <text x="394" y="424" fill="#3C8060" font-size="19">▧</text>
      <text x="435" y="413" fill="#768397" font-size="11" font-weight="700">LIGHT: SCIENCE &amp; APPLICATIONS</text>
      <text x="435" y="437" fill="#243147" font-size="14" font-weight="650">All-optical image denoising</text>

      <rect x="366" y="464" width="552" height="68" rx="16" fill="#FFFFFF" stroke="#E1E5EB"/>
      <rect x="382" y="479" width="38" height="38" rx="10" fill="#F4ECDD"/>
      <text x="394" y="504" fill="#A26B20" font-size="19">▤</text>
      <text x="435" y="493" fill="#768397" font-size="11" font-weight="700">ARXIV · MACHINE LEARNING</text>
      <text x="435" y="517" fill="#243147" font-size="14" font-weight="650">Memory-compute efficient inference</text>
    </g>

    <rect x="950" y="150" width="374" height="450" rx="23" fill="#F7F9FC" stroke="#D8E0EB"/>
    <rect x="976" y="174" width="44" height="44" rx="14" fill="url(#blue)"/>
    <path d="M990 198L998 188L1006 198L998 204L990 198Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <text x="1034" y="190" fill="#17243A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">PAPER COMPOSER</text>
    <text x="1034" y="210" fill="#7A8798" font-family="Inter, Arial, sans-serif" font-size="11">Linked to the paper you are reading</text>

    <rect x="976" y="245" width="322" height="48" rx="15" fill="#EDF4FF" stroke="#A6C5F7"/>
    <rect x="990" y="257" width="26" height="26" rx="8" fill="#CFE1FF"/>
    <text x="998" y="276" fill="#2161D1" font-family="Inter, Arial, sans-serif" font-size="15">▤</text>
    <text x="1027" y="266" fill="#243147" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Linked content</text>
    <text x="1027" y="281" fill="#78869A" font-family="Inter, Arial, sans-serif" font-size="10">Inference in the Shadows · 21 pages</text>

    <rect x="998" y="324" width="300" height="75" rx="18" fill="#DCEAFF"/>
    <text x="1018" y="353" fill="#26344A" font-family="Inter, Arial, sans-serif" font-size="12">Explain the selected figure and</text>
    <text x="1018" y="374" fill="#26344A" font-family="Inter, Arial, sans-serif" font-size="12">connect it to the full paper.</text>
    <rect x="976" y="424" width="287" height="62" rx="18" fill="#FFFFFF" stroke="#E0E6EF"/>
    <rect x="993" y="441" width="120" height="7" rx="3.5" fill="#39506F" opacity=".83"/>
    <rect x="993" y="457" width="224" height="7" rx="3.5" fill="#78869A" opacity=".42"/>
    <rect x="993" y="473" width="176" height="7" rx="3.5" fill="#78869A" opacity=".27"/>

    <rect x="976" y="516" width="322" height="58" rx="20" fill="#FFFFFF" stroke="#DCE3EC"/>
    <text x="997" y="551" fill="#708096" font-family="Inter, Arial, sans-serif" font-size="12">Ask about this paper…</text>
    <circle cx="1269" cy="545" r="18" fill="#17243A"/>
    <path d="M1269 553V537M1263 543L1269 537L1275 543" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
